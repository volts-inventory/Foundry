# zram swap (compressed RAM swap) — a safety net so a memory spike during gates
# doesn't OOM-kill the build. ALWAYS prefer this over swapping to the SD card,
# which causes brutal, sustained card wear.
#
# Setup on Raspberry Pi OS / Debian:
#   sudo apt install zram-tools
#   sudo cp deploy/pi/zramswap.conf /etc/default/zramswap
#   sudo systemctl restart zramswap
#
# And DISABLE the on-card swap file (stop wearing the SD):
#   sudo dphys-swapfile swapoff && sudo systemctl disable dphys-swapfile

ALGO=zstd
# Use ~50% of RAM for compressed swap (~4 GB of zram on an 8 GB Pi 5).
PERCENT=50
PRIORITY=100
