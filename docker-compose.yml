# Foundry — LAN deployment (the Workshop, one service, plain HTTP).
#
# `docker compose up` runs the Workshop fully functional with NO secrets: the
# keyless `mock` backend, sqlite checkpoints + a filesystem CAS on volumes,
# durable state that survives a restart. Open http://localhost:8765 (or
# http://<this-host>:8765 from another device on your LAN).
#
# Real builds: pick a backend + supply its credential via a gitignored .env
# (see below). For claude -p on a Max subscription, mint a token once with
# `make token` and set CLAUDE_CODE_OAUTH_TOKEN (do NOT also set ANTHROPIC_API_KEY
# — it outranks the token and bills the pay-per-token API).
#
# Lint:  docker compose config        # validates this YAML, no daemon needed.

volumes:
  foundry_cas: {}     # filesystem CAS (content-addressed artifact bodies)
  foundry_state: {}   # sqlite checkpoint DB + trust ledgers
  foundry_web: {}     # the Workshop's written output (code + doc bundles per floor)

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: foundry:dev
    restart: unless-stopped
    # 12-factor config: every value comes from the environment; secrets come from
    # a .env file (gitignored), never the image.
    environment:
      FOUNDRY_CAS_ROOT: "/var/lib/foundry/cas"
      FOUNDRY_CHECKPOINT_DB: "/var/lib/foundry/state/checkpoints.sqlite"

      # --- model backend (foundry.proxy.backend_from_env) ---------------------
      # Default "mock": fully functional out of the box, no secrets. Set
      # anthropic | claude-cli | codex | ollama-gemma (+ the matching credential)
      # for real model egress — the SAME factory flow. The UI's picker also
      # selects per build.
      FOUNDRY_MODEL_BACKEND: "${FOUNDRY_MODEL_BACKEND:-mock}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"              # anthropic SDK backend
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"  # claude-cli (Max subscription)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"                    # codex backend
      # ollama-gemma: Ollama runs on the HOST (it owns the GPU natively — we never
      # pass a GPU into a container); the app reaches it over HTTP.
      FOUNDRY_OLLAMA_URL: "${FOUNDRY_OLLAMA_URL:-http://host.docker.internal:11434}"

      # Optional shared token: gates every state-changing request (start/steer a
      # build). Empty = none (the same-origin/CSRF guard always applies). Set one
      # if other people share your LAN; open the UI at .../?token=<the token>.
      FOUNDRY_WORKSHOP_TOKEN: "${FOUNDRY_WORKSHOP_TOKEN:-}"

      # --- workshop UI (the image's default CMD: python -m webapp.server) ------
      WORKSHOP_HOST: "0.0.0.0"                       # reachable from the host / LAN
      WORKSHOP_PORT: "8765"
      WORKSHOP_OUTPUT_DIR: "/var/lib/foundry/web"
    volumes:
      - foundry_cas:/var/lib/foundry/cas
      - foundry_state:/var/lib/foundry/state
      - foundry_web:/var/lib/foundry/web
    ports:
      - "${WORKSHOP_PORT:-8765}:8765"
    # Reach a host-run Ollama (or GPU box) by name. Docker Desktop provides this
    # automatically; Linux needs the explicit mapping.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Default CMD serves the Workshop UI on :8765 (see Dockerfile). For a one-shot
    # headless build instead, override:
    #   command: ["foundry", "run", "--out", "/var/lib/foundry/web/code", "build a thing"]
