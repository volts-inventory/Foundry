[project]
name = "foundry"
version = "0.1.0"
description = "Foundry — graph-based multi-agent software factory (Phase 0 backbone)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "pytest>=9.0.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003: docstrings quote the design docs, which use typographic
# dashes/multiplication signs; not worth mangling the prose.
ignore = ["RUF002", "RUF003"]
