[project]
name = "foundry"
version = "0.1.0"
description = "Foundry — graph-based multi-agent software factory"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.109.1",
    "langgraph>=1.2.4",
    "langgraph-checkpoint-sqlite>=3.1.0",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.2",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "mypy>=1.13",
    "mutmut>=3.2",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Production classes named Test* (TestGate, TestPlan, TestReport) are domain
# types, not test cases — only collect classes prefixed "Test_".
python_classes = ["Test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF002/RUF003: docstrings quote the design docs, which use typographic
# dashes/multiplication signs; not worth mangling the prose.
ignore = ["RUF002", "RUF003"]

# Type checker — the static-analysis quality bar (ARCHITECTURE.md QUALITY BARS).
# `--ignore-missing-imports` is expressed here so `mypy foundry tests` is the gate.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# Coverage bar is enforced at milestone gates via `--cov-fail-under` on the CLI.
[tool.coverage.run]
source = ["foundry"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

# Mutation testing (milestone gate, scoped to changed paths). See build/DECISIONS.md D7.
# mutmut 3.x copies source_paths into a mutants/ tree and runs the suite from there, so the
# WHOLE foundry package must be present for imports (foundry.agents et al.) to resolve —
# narrowing source_paths to one file (the original D7 failure) breaks the package import.
# Fix: copy the full tree but scope which lines are MUTATED with only_mutate, and run only
# the target module's targeted tests via pytest_add_cli_args_test_selection (a time-boxed,
# per-module gate; flip only_mutate/test-selection to the module under change).
[tool.mutmut]
source_paths = ["foundry"]
only_mutate = ["foundry/state/reducers.py"]
pytest_add_cli_args_test_selection = [
    "tests/test_reducers_properties.py",
    "tests/test_merge_gates_grounding.py",
]
