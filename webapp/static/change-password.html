<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Foundry Workshop — change password</title>
<link rel="icon" type="image/svg+xml" href="/icon.svg" />
<meta name="theme-color" content="#0e1320" />
<style>
  :root { --bg:#0e1320; --card:#151b2b; --line:#26304a; --ink:#e6edf3; --muted:#8b97ad; --gold:#ffcf52; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:2rem 1.25rem;
         background:var(--bg); color:var(--ink);
         font:16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width:min(25rem,100%); background:var(--card); border:1px solid var(--line);
         border-radius:14px; padding:1.6rem 1.5rem; }
  h1 { margin:0 0 .4rem; font-size:1.25rem; letter-spacing:-.02em; }
  .sub { margin:0 0 1.3rem; color:var(--muted); font-size:.875rem; }
  label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:.3rem; }
  input { width:100%; font:inherit; padding:.55rem .7rem; margin-bottom:1rem;
          border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--ink); }
  input:focus { outline:2px solid var(--gold); outline-offset:-1px; }
  button { width:100%; font:inherit; font-weight:700; padding:.6rem 1rem; border-radius:8px;
           border:1px solid var(--gold); background:var(--gold); color:#1a1400; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--bad); font-size:.85rem; margin:0 0 1rem; min-height:1.2em; }
</style>
</head>
<body>
<form id="form">
  <h1>Change the default password</h1>
  <p class="sub">
    This account can start builds — real model spend, and generated code that
    gets executed. It's still on the password everyone knows, so nothing will
    run until that changes. At least 10 characters.
  </p>
  <p class="err" id="err"></p>
  <label for="cur">Current password</label>
  <input id="cur" type="password" autocomplete="current-password" autofocus>
  <label for="new">New password</label>
  <input id="new" type="password" autocomplete="new-password">
  <label for="again">New password again</label>
  <input id="again" type="password" autocomplete="new-password">
  <button id="go" type="submit">Change it</button>
</form>
<script>
const $ = (id) => document.getElementById(id);
$("form").onsubmit = async (event) => {
  event.preventDefault();
  const err = $("err"); err.textContent = "";
  if ($("new").value !== $("again").value) { err.textContent = "The two new passwords don't match."; return; }
  $("go").disabled = true;
  try {
    const response = await fetch("/api/password", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ current: $("cur").value, new: $("new").value }),
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || ("HTTP " + response.status));
    location.href = "/";
  } catch (e) { err.textContent = e.message; $("go").disabled = false; }
};
</script>
</body>
</html>
